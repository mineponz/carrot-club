<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>OGP card 1200x630</title>
    <!--
      SNS共有カード（og:image / twitter:image）の元画像。1200x630 固定。

      - `scripts/generate-og.mjs` がこのファイルを Playwright の chromium で開いて
        `public/og.png` に書き出す。ブラウザで直接開けばそのまま目視確認できる。
      - **外部リソース（Webフォント・画像・CDN）を一切読み込まない。** オフラインでも
        毎回同じ絵が出ることを優先し、フォントはOS標準、装飾はCSSのみで作る。
      - 配色は src/layouts/BaseLayout.astro のライトテーマの変数値をそのまま写している。
        本体の色を変えたらここも合わせる（自動連動はしない）。
      - タイムラインのサムネイルは横400px程度まで縮む。文字が潰れないよう、
        最小でも24px（縮小後8px相当）を下限にしている。
    -->
    <style>
      :root {
        /* BaseLayout.astro のライトテーマと同値。ダークテーマには追従させない */
        --bg: #fbfaf7;
        --surface: #ffffff;
        --border: #ddd8cd;
        --text: #23201c;
        --muted: #6b6558;
        --accent: #b5651d;
        --accent-weak: #f5e9dc;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Noto Sans JP", "Yu Gothic", sans-serif;
      }

      /* スクリーンショット環境のOS設定でダークに転ばないよう明示する */
      html {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
      }

      /* 左端のアクセント帯。ブランドカラーの手がかりを1つだけ置く */
      .rail {
        flex: none;
        width: 28px;
        background: var(--accent);
      }

      /* 右下に薄いアクセント円。文字には重ならない位置に置く */
      .blob {
        position: absolute;
        right: -180px;
        bottom: -260px;
        width: 720px;
        height: 720px;
        border-radius: 50%;
        background: var(--accent-weak);
      }

      .inner {
        position: relative; /* .blob より前面に出す */
        z-index: 1;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 56px 72px;
      }

      .wordmark {
        margin: 0 0 24px;
        font-family: var(--mono);
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--accent);
      }

      h1 {
        margin: 0;
        font-size: 80px;
        font-weight: 700;
        line-height: 1.22;
        letter-spacing: -0.02em;
      }

      .lead {
        margin: 28px 0 0;
        font-size: 42px;
        font-weight: 600;
        line-height: 1.4;
        color: var(--text);
      }

      .lead .num {
        color: var(--accent);
      }

      .chips {
        display: flex;
        gap: 16px;
        margin: 32px 0 0;
        padding: 0;
        list-style: none;
      }

      .chips li {
        padding: 8px 22px;
        border: 2px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        font-size: 28px;
        line-height: 1.4;
        color: var(--muted);
      }

      .notice {
        margin: 30px 0 0;
        font-size: 24px;
        line-height: 1.5;
        color: var(--muted);
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="rail"></div>
      <div class="blob"></div>

      <div class="inner">
        <p class="wordmark">carrot-club</p>

        <h1>キャロットクラブ<br />出資馬検討ツール</h1>

        <p class="lead">
          2025年募集馬<span class="num">93頭</span>を血統・馬体・価格で比較
        </p>

        <ul class="chips">
          <li>並べ替え</li>
          <li>絞り込み</li>
          <li>自分の評価を保存</li>
        </ul>

        <p class="notice">
          個人が作った非公式ツールです。株式会社キャロットクラブとは関係ありません。
        </p>
      </div>
    </div>
  </body>
</html>
